<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hearme">
<meta name="theme-color" content="#080809">
<link rel="manifest" href="manifest.json">
<title>hearme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080809;--s1:#101113;--s2:#18191c;--s3:#202226;--s4:#28292e;
  --ln:rgba(255,255,255,.055);--ln2:rgba(255,255,255,.10);
  --tx:#edecea;--tx2:#83868f;--tx3:#44464d;
  --cr:#e8e3d7;--cr2:#c5bfb2;
  --bl:#5b8cff;--tl:#43cfc6;--rs:#ff6585;--am:#ffb240;--vi:#a78bfa;
  --sat:env(safe-area-inset-top,44px);--sab:env(safe-area-inset-bottom,20px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:'DM Sans',sans-serif;color:var(--tx);position:fixed;inset:0;}

/* ── SCREENS ── */
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .22s ease;background:var(–bg);overflow:hidden;}
.scr.on{opacity:1;pointer-events:all;}

/* ── STATUS BAR ── */
.sb{position:absolute;top:0;left:0;right:0;z-index:200;height:calc(var(–sat)+22px);display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 4px;font-size:12px;font-weight:600;letter-spacing:.02em;}

/* ── PAGE AREA ── */
.pg{position:absolute;top:calc(var(–sat)+22px);left:0;right:0;bottom:calc(var(–sab)+58px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.pg::-webkit-scrollbar{display:none;}

/* ── BOTTOM NAV ── */
.bnav{position:absolute;bottom:0;left:0;right:0;background:var(–bg);border-top:1px solid var(–ln);display:flex;align-items:center;justify-content:space-around;padding-bottom:var(–sab);padding-top:8px;z-index:100;height:calc(var(–sab)+58px);}
.nb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(–tx3);transition:color .18s;padding:3px 14px;font-family:‘DM Sans’,sans-serif;}
.nb.on{color:var(–cr);}
.nb svg{width:20px;height:20px;}
.nb-l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;}
.fab-w{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:3px 14px;}
.fab{width:42px;height:42px;background:var(–cr);border-radius:50%;display:flex;align-items:center;justify-content:center;position:absolute;top:-20px;box-shadow:0 2px 16px rgba(0,0,0,.5),0 0 0 3px var(–bg);transition:transform .14s;}
.fab-w:active .fab{transform:scale(.91);}
.fab-l{font-size:9px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(–cr);margin-top:24px;}

/* ── COMMON ── */
.card{background:var(–s1);border:1px solid var(–ln);border-radius:16px;}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(–s3);border:1px solid var(–ln2);border-radius:20px;padding:4px 10px;font-size:11px;color:var(–tx2);}
.btn-p{background:var(–cr);color:var(–bg);border:none;border-radius:13px;font-family:‘DM Sans’,sans-serif;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .12s,opacity .12s;}
.btn-p:active{transform:scale(.96);}
.btn-p:disabled{opacity:.35;pointer-events:none;}
.btn-g{background:var(–s2);color:var(–tx);border:1px solid var(–ln2);border-radius:12px;font-family:‘DM Sans’,sans-serif;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s;}
.btn-g:active{background:var(–s3);}
.syne{font-family:‘Syne’,sans-serif;}
.lbl{font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(–tx3);}
.inp{background:var(–s2);border:1.5px solid var(–ln);border-radius:12px;padding:14px 16px;font-family:‘DM Sans’,sans-serif;font-size:15px;color:var(–tx);width:100%;outline:none;transition:border-color .18s;}
.inp:focus{border-color:var(–ln2);}
.inp::placeholder{color:var(–tx3);}
.chip-emo{font-size:10px;background:var(–s3);border:1px solid var(–ln);padding:3px 9px;border-radius:20px;color:var(–tx2);white-space:nowrap;}
.ava-ring{border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}

/* ── TOAST ── */
.toast{position:fixed;z-index:9999;bottom:calc(var(–sab)+68px);left:16px;right:16px;background:var(–cr);color:var(–bg);border-radius:13px;padding:12px 18px;font-size:13px;font-weight:600;text-align:center;transform:translateY(14px);opacity:0;transition:transform .26s ease,opacity .26s ease;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}

/* ── LOADER ── */
.loader-full{position:fixed;inset:0;background:var(–bg);display:flex;align-items:center;justify-content:center;z-index:8888;flex-direction:column;gap:14px;}
.loader-full.gone{display:none;}
@keyframes sp2{to{transform:rotate(360deg)}}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid var(–s4);border-top-color:var(–cr);animation:sp2 .7s linear infinite;}

/* ══ SPLASH ══ */
#scr-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;}
#scr-splash::after{content:’’;position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(91,140,255,.06) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-58%);pointer-events:none;}
.sp-mk{position:relative;width:88px;height:88px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;}
.sp-r{position:absolute;border-radius:50%;border:1px solid;}
.sp-r:nth-child(1){inset:-12px;border-color:rgba(232,227,215,.12);animation:sra 3.5s ease-out infinite;}
.sp-r:nth-child(2){inset:-24px;border-color:rgba(232,227,215,.06);animation:sra 3.5s ease-out infinite .7s;}
.sp-r:nth-child(3){inset:-38px;border-color:rgba(232,227,215,.03);animation:sra 3.5s ease-out infinite 1.4s;}
@keyframes sra{0%{transform:scale(.82);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.sp-w{font-family:‘Syne’,sans-serif;font-size:40px;font-weight:800;letter-spacing:-.05em;color:var(–cr);line-height:1;margin-bottom:8px;}
.sp-sub{font-size:11px;color:var(–tx3);letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px;}
.sp-wv{display:flex;gap:4px;align-items:center;height:24px;}
.sw{width:3px;border-radius:3px;background:var(–cr2);}
.sw:nth-child(1){animation:wv1 1.1s ease-in-out infinite;}
.sw:nth-child(2){animation:wv2 1.1s ease-in-out infinite .1s;}
.sw:nth-child(3){animation:wv3 1.1s ease-in-out infinite .2s;}
.sw:nth-child(4){animation:wv4 1.1s ease-in-out infinite .3s;}
.sw:nth-child(5){animation:wv3 1.1s ease-in-out infinite .4s;}
.sw:nth-child(6){animation:wv1 1.1s ease-in-out infinite .5s;}
.sw:nth-child(7){animation:wv2 1.1s ease-in-out infinite .6s;}
@keyframes wv1{0%,100%{height:4px}50%{height:17px}}
@keyframes wv2{0%,100%{height:10px}50%{height:5px}}
@keyframes wv3{0%,100%{height:19px}50%{height:7px}}
@keyframes wv4{0%,100%{height:7px}50%{height:22px}}
.sp-hint{position:absolute;bottom:48px;font-size:10px;color:var(–tx3);letter-spacing:.14em;text-transform:uppercase;animation:bk 2.2s ease-in-out infinite;}
@keyframes bk{0%,100%{opacity:.2}50%{opacity:.8}}

/* ══ ONBOARDING ══ */
#scr-onboard{display:flex;flex-direction:column;}
.ob-wrap{position:absolute;inset:0;overflow-y:auto;padding:calc(var(–sat)+32px) 24px 40px;display:flex;flex-direction:column;align-items:center;}
.ob-wrap::-webkit-scrollbar{display:none;}
.ob-logo{font-family:‘Syne’,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.04em;color:var(–cr);margin-bottom:28px;align-self:flex-start;}
.ob-step-wrap{width:100%;max-width:360px;}
.ob-ttl{font-family:‘Syne’,sans-serif;font-size:24px;font-weight:800;letter-spacing:-.04em;margin-bottom:6px;line-height:1.2;}
.ob-sub{font-size:13px;color:var(–tx2);margin-bottom:24px;line-height:1.65;}
/* avatar picker */
.ava-pick-box{background:var(–s1);border:1px solid var(–ln);border-radius:16px;padding:16px;margin-bottom:16px;}
.ava-pick-preview{width:72px;height:72px;border-radius:50%;background:var(–s2);border:2px solid var(–ln2);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;overflow:hidden;cursor:pointer;position:relative;}
.ava-pick-preview img{width:100%;height:100%;object-fit:cover;}
.ava-photo-btn{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;background:var(–cr);display:flex;align-items:center;justify-content:center;}
.ava-emoji-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
.ava-opt{width:46px;height:46px;border-radius:50%;background:var(–s2);border:2px solid var(–ln);font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,transform .12s;flex-shrink:0;}
.ava-opt.on{border-color:var(–cr);transform:scale(1.08);}
/* code box */
.code-box{background:var(–s2);border:1px solid var(–ln2);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px;}
.code-val{font-family:‘Syne’,sans-serif;font-size:34px;font-weight:800;letter-spacing:.12em;color:var(–cr);}
.code-lbl{font-size:10px;color:var(–tx3);margin-top:5px;letter-spacing:.06em;}
/* dots */
.ob-dots{display:flex;gap:6px;justify-content:center;margin-bottom:18px;}
.ob-dot{width:6px;height:6px;border-radius:3px;background:var(–s4);transition:width .2s,background .2s;}
.ob-dot.on{width:20px;background:var(–cr);}

/* ══ BEREAL OVERLAY ══ */
#bereal-ov{position:fixed;inset:0;z-index:5000;background:rgba(8,8,9,.9);backdrop-filter:blur(18px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:15px;padding:28px 24px;}
