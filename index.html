<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hearme">
<meta name="theme-color" content="#070708">
<meta name="description" content="きもちを、音楽で届ける。今日の気分を1曲でシェアする、静かなSNS。">
<title>hearme</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=7.0.0">
</head>
<body>
<div id="app">
  <!-- tabs -->
  <section class="tab on" id="t-home"></section>
  <section class="tab" id="t-explore"></section>
  <section class="tab" id="t-dm"></section>
  <section class="tab" id="t-me"></section>

  <!-- mini player -->
  <div id="mini"></div>

  <!-- bottom nav -->
  <nav class="nav hide" id="nav">
    <button class="nb on" data-act="tab" data-tab="home" aria-label="ホーム">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6h-5.6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg><small>ホーム</small></button>
    <button class="nb" data-act="tab" data-tab="explore" aria-label="探す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><small>探す</small></button>
    <button class="fab" data-act="compose" aria-label="投稿"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i></button>
    <button class="nb" data-act="tab" data-tab="dm" aria-label="DM">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 12a8 8 0 0 1-11.8 7L3.5 20.5 5 15.6A8 8 0 1 1 20.5 12z"/></svg><small>DM</small><span class="badge hide" id="dm-badge"></span></button>
    <button class="nb" data-act="tab" data-tab="me" aria-label="プロフィール">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-3.8 4-6 8-6s7.2 2.2 8 6"/></svg><small>じぶん</small><span class="badge hide" id="me-badge"></span></button>
  </nav>

  <!-- stacked pages -->
  <div class="page" id="pg-chat"></div>
  <div class="page" id="pg-settings"></div>
</div>

<!-- onboarding / login -->
<div class="ob hide" id="ob"></div>

<!-- sheets -->
<div class="sheet-bg" id="sheet-bg" data-act="close-sheet"></div>
<div class="sheet" id="sheet"><div class="grab"><i></i></div><div class="sheet-body" id="sheet-body"></div></div>

<!-- hearme moment -->
<div id="moment-ov"></div>

<div id="toast"><div></div></div>
<div id="net" class="hide">オフラインです</div>

<!-- splash (JSが読み込まれるまで) -->
<div id="splash" style="position:fixed;inset:0;z-index:999;background:#070708;display:grid;place-items:center;transition:opacity .4s;">
  <img src="/logo-mark.png" alt="" style="width:96px;opacity:.95">
</div>

<script type="module" src="/app.js?v=7.0.0"></script>
</body>
</html>
