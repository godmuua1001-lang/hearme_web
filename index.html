<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">
<meta property="og:site_name" content="hearme">
<meta property="og:title" content="hearme — きもちを、音楽で届ける">
<meta property="og:description" content="今日の気分を1曲でシェアする、静かなSNS。招待コードでフレンドとつながろう。">
<meta property="og:url" content="https://hearme-web-two.vercel.app/">
<meta property="og:image" content="https://hearme-web-two.vercel.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hearme-web-two.vercel.app/og-image.png">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=10.2.2">
</head>
<body>
<div id="app">
  <!-- tabs -->
  <section class="tab on" id="t-home"></section>
  <section class="tab" id="t-listen"></section>
  <section class="tab" id="t-dm"></section>
  <section class="tab" id="t-me"></section>

  <!-- mini player -->
  <div id="mini"></div>

  <!-- bottom nav -->
  <nav class="nav hide" id="nav">
    <button class="nb on" data-act="tab" data-tab="home" aria-label="そら">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 18a9 9 0 0 1 18 0"/><path d="M7 18a5 5 0 0 1 10 0"/></svg><small>そら</small></button>
    <button class="nb" data-act="tab" data-tab="listen" aria-label="きく">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5"/></svg><small>きく</small><span class="badge hide" id="ls-badge"></span></button>
    <button class="fab" data-act="compose" aria-label="色をたす"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b0b0c" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i></button>
    <button class="nb" data-act="tab" data-tab="dm" aria-label="とどいた">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 7.5 12 13l8.5-5.5"/><rect x="3.5" y="5" width="17" height="14" rx="2.5"/></svg><small>とどいた</small><span class="badge hide" id="dm-badge"></span></button>
    <button class="nb" data-act="tab" data-tab="me" aria-label="じぶん">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c.8-3.8 4-6 8-6s7.2 2.2 8 6"/></svg><small>じぶん</small><span class="badge hide" id="me-badge"></span></button>
  </nav>

  <!-- stacked pages -->
  <div class="page" id="pg-chat"></div>
  <div class="page" id="pg-settings"></div>
  <div class="page" id="pg-sub"></div>
  <div class="page" id="pg-prof"></div>
</div>

<!-- onboarding / login -->
<div class="ob hide" id="ob"></div>

<!-- sheets -->
<div class="sheet-bg" id="sheet-bg" data-act="close-sheet"></div>
<div class="sheet" id="sheet"><div class="grab"><i></i></div><div class="sheet-body" id="sheet-body"></div></div>

<!-- hearme moment -->
<div id="moment-ov"></div>

<div id="toast"><div></div></div>
<div id="net" class="hide">オフラインです</div>

<!-- splash (JSが読み込まれるまで) -->
<div id="splash" style="position:fixed;inset:0;z-index:999;background:#070708;display:grid;place-items:center;transition:opacity .4s;">
  <img src="/logo-mark.png" alt="" style="width:96px;opacity:.95">
</div>

<script type="module" src="/app.js?v=10.2.2"></script>
</body>
</html>
